<!DOCTYPE html>
<html lang="de">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Webapplikation für Lager Management">
        <meta name="keywords" content="HTML, CSS, Javascript">
        <meta name="author" content="Nicolas_Weber">
        <title>MK Lager</title>
        <link rel="stylesheet" href="styles/style.css">
    </head>
    <main>

        <div class="banner">
            <p class="banner_text">
                MK<span style="font-size: 0.4em;vertical-align:text-top;">&reg;</span> Lager
            </p>
        </div>

        <div class="login" id="login">
            <form class="login_form">
                <div class="element_Input">
                    <label for="email" name="Email">
                        Email
                    </label>
                    <input class="input_field" type="text" id="email" name="email">
                </div>
                <div class="element_Input">
                    <label for="password" name="Password">
                        Passwort
                    </label>
                    <input class="input_field" type="text" id="password" name="password">
                </div>
                <div class="element_Input checkbox">
                    <input class="checkbox_inner" type="checkbox" id="remember" name="remember">
                    <label for="remember" name="remember me?"> remember me?</label>
                </div>
                <div class="buttons">
                    <button type="button" class="input_button" onclick="disHome()">Login</button>
                    <script src="scripts/transitions.js"></script>
                </div>
                <div>
                    <p class="error_msg">
                        *Email oder Passwort ist falsch*
                    </p>
                </div>
            </form>
        </div>

        <div class="home" id="home">
            <div class="home_buttons">
                <div class="user_info">
                    <p id="username">Username</p>
                    <button type="button" class="input_button" onclick="disLogin()">Logout</button>
                </div>
                <div class="buttons">
                    <button type="button" class="input_button" id="currentmonth" onclick="disEintragDisplay()"></button>
                    <button type="button" class="input_button" id="nextmonth" onclick="disEintragDisplay()"></button>
                    <button type="button" class="input_button" id="next2month" onclick="disEintragDisplay()"></button>
                    <button type="button" class="input_button" onclick="disFilter()">Spezifisch Suchen</button>
                    <button type="button" class="input_button" onclick="disEintragCreate()">Eintrag erstellen</button>
                    <script src="scripts/months.js"></script>
                    <script src="scripts/transitions.js"></script>
                </div>
            </div>
        </div>

        <div class="filter" id="filter">
            <div class="title">Filter setzen</div>
            <form class="filter_input">
                <div class="element_Input">
                    <label for="name" name="Name">
                        Name
                    </label>
                    <input class="input_field" type="text" id="name" name="name">
                </div>
                <div class="element_Input">
                    <label for="artikelnr" name="Artikel Nr.">
                        Artikel Nr.
                    </label>
                    <input class="input_field" type="text" id="artikelnr" name="artikel nr.">
                </div>
                <div class="element_Input">
                    <label for="pflege_linie" name="Pflege Linie">
                        Pflege Linie
                    </label>
                    <select class="select_field" id="pflege_linie" name="pflege linie">
                        <option value="none"></option>
                        <option value="hautpflege">Hautpflege</option>
                        <option value="koerperpflege">K&#246;rperpflege</option>
                    </select>
                </div>
                <div class="element_Input">
                    <label for="kategorie" name="Kategorie">
                        Kategorie
                    </label>
                    <select class="select_field" id="kategorie" name="kategorie">
                        <option value="none"></option>
                        <option value="hautpflege">Hautpflege</option>
                        <option value="koerperpflege">K&#246;rperpflege</option>
                    </select>
                </div>
                <div class="element_Input">
                    <label for="farbe" name="Farbe">
                        Farbe
                    </label>
                    <input class="input_field" type="text" id="farbe" name="farbe">
                </div>
                <div class="element_Input">
                    <label for="hauttyp" name="Hauttyp">
                        Hauttyp
                    </label>
                    <select class="select_field" id="hauttyp" name="hauttyp">
                        <option value="none"></option>
                        <option value="hautpflege">Hautpflege</option>
                        <option value="koerperpflege">K&#246;rperpflege</option>
                    </select>
                </div>
                <div class="element_Input">
                    <label for="datum" name="Datum">
                        Datum
                    </label>
                    <input class="date_field" type="month" id="datum" name="datum">
                </div>
                <div class="buttons">
                    <button type="button" class="input_button" onclick="disEintragDisplay()">Suchen</button>
                    <button type="button" class="input_button">Löschen</button>
                    <button type="button" class="input_button" onclick="disHome()">Zurück</button>
                    <script src="scripts/transitions.js"></script>
                </div>
            </form>
        </div>

        <div class="eintrag_display" id="eintrag_display">
            <div class="title">Einträge anzeigen</div>
            <div class="buttons">
                <button type="button" class="input_button" onclick="disHome()">Zurück</button>
                <button type="button" class="input_button" onclick="disEintragChange()">(Temp) Eintrag ändern</button>
                <script src="scripts/transitions.js"></script>
            </div>
            <div class="eintrag_lineup">
                
            </div>
        </div>



        <div class="eintrag_create" id="eintrag_create">
            <div class="title">Eintrag erstellen</div>
            <form class="eintrag_input">
                <div class="element_Input">
                    <label for="artikelnr" name="Artikel Nr.">
                        Artikel Nr.
                    </label>
                    <input class="input_field" type="text" id="artikelnr" name="artikel nr.">
                </div>
                <div class="element_Input">
                    <label for="datum" name="Datum">
                        Datum
                    </label>
                    <input class="date_field" type="month" id="datum" name="datum">
                </div>
                <div class="element_Input">
                    <label for="menge" name="Menge">
                        Menge
                    </label>
                    <input class="input_field" type="number" id="menge" name="menge">
                </div>
                <div class="buttons">
                    <button type="button" class="input_button" onclick="disHome()">Erstellen</button>
                    <button type="button" class="input_button" onclick="disHome()">Abbrechen</button>
                    <script src="scripts/transitions.js"></script>
                </div>
            </form>
        </div>

        <div class="eintrag_change" id="eintrag_change">
            <div class="title">Eintrag ändern</div>
            <form class="eintrag_input">
                <div class="element_Input">
                    <label for="name" name="Name">
                        Name
                    </label>
                    <input class="input_field" type="text" id="name" name="name" readonly>
                </div>
                <div class="element_Input">
                    <label for="artikelnr" name="Artikel Nr.">
                        Artikel Nr.
                    </label>
                    <input class="input_field" type="text" id="artikelnr" name="artikel nr." readonly value="test">
                </div>
                <div class="element_Input">
                    <label for="pflege_linie" name="Pflege Linie">
                        Pflege Linie
                    </label>
                    <input class="input_field" type="text" id="pflege_linie" name="pflege_linie" readonly>
                </div>
                <div class="element_Input">
                    <label for="kategorie" name="Kategorie">
                        Kategorie
                    </label>
                    <input class="input_field" type="text" id="kategorie" name="kategorie" readonly>
                </div>
                <div class="element_Input">
                    <label for="farbe" name="Farbe">
                        Farbe
                    </label>
                    <input class="input_field" type="text" id="farbe" name="farbe" readonly>
                </div>
                <div class="element_Input">
                    <label for="hauttyp" name="Hauttyp">
                        Hauttyp
                    </label>
                    <input class="input_field" type="text" id="hauttyp" name="hauttyp" readonly>
                </div>
                <div class="element_Input">
                    <label for="datum" name="Datum">
                        Datum
                    </label>
                    <input class="date_field" type="month" id="datum" name="datum">
                </div>
                <div class="element_Input">
                    <label for="menge" name="Menge">
                        Menge
                    </label>
                    <input class="input_field" type="number" id="menge" name="menge">
                </div>
                <div class="buttons">
                    <button type="button" class="input_button" onclick="disEintragDisplay()">Speichern</button>
                    <button type="button" class="input_button" onclick="disEintragDisplay()">Abbrechen</button>
                    <script src="scripts/transitions.js"></script>
                </div>
            </form>
        </div>
        <div class="footer_buffer"></div>
        <footer>
            <p>Copyright 2026</p>
        </footer>
    </main>
</html>
